<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo de Galeria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        /* Fundo escuro para destacar o aviso inicial */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            width: 350px;
        }
        .modal h2 { margin-top: 0; font-size: 1.3rem; }
        .modal button {
            padding: 10px 25px;
            margin: 10px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .btn-yes { background-color: #e74c3c; color: white; }
        .btn-no { background-color: #7f8c8d; color: white; }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .thumbnail {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .thumbnail:hover { transform: scale(1.05); }
        
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Tela de Aviso Inicial -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h2>Você está sozinho agora? ⚠️👀</h2>
            <button class="btn-no" onclick="handleChoice('no')">Não</button>
            <button class="btn-yes" onclick="handleChoice('yes')">Sim</button>
        </div>
    </div>

    <!-- Container da Galeria (Inicia Oculto) -->
    <div id="gallery-container" style="display:none;">
        <h2>Galeria de Fotos</h2>
        <div id="gallery" class="gallery"></div>
    </div>

    <!-- Janela de Zoom (Lightbox) -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="light-image" src="" alt="Imagem Expandida">
    </div>

    <script>
        // Substitua as URLs abaixo pelos links diretos dos seus GIFs/Imagens
        const images = [
            {id: "gif_pesca_01", url: "https://i.pinimg.com/736x/46/e7/46/46e74682c5d5b036ec932c0bb19ccd04.jpg", type: "fish"},
            {id: "gif_port_01", url: "https://i.postimg.cc/brV8xcbc/Homen-9.jpg", type: "portfolio"},
            {id: "gif_pesca_02", url: "https://i.pinimg.com/1200x/7e/56/c8/7e56c82bee97ab59428b9ef1a5d014ee.jpg", type: "fish"},
            {id: "gif_port_02", url: "https://i.postimg.cc/90gVd59N/Homen-4.jpg", type: "portfolio"},
            {id: "gif_port_03", url: "https://i.postimg.cc/kGY9Q38r/Homen-10.jpg", type: "portfolio"},
            {id: "gif_port_04", url: "https://i.postimg.cc/6qbwrJRX/Homen-15.jpg", type: "portfolio"},
            {id: "gif_port_05", url: "https://i.postimg.cc/SR1q6F8p/Homen-12.jpg", type: "portfolio"},
            {id: "gif_port_06", url: "https://i.postimg.cc/x8pYvDHY/Homen-13.jpg", type: "portfolio"},
            {id: "gif_port_07", url: "https://i.postimg.cc/2y9mQRWG/Homen-3.jpg", type: "portfolio"},
            {id: "gif_port_08", url: "https://i.postimg.cc/0jXxYRS4/Homen-7.jpg", type: "portfolio"},
            {id: "gif_port_09", url: "https://i.postimg.cc/nrSZ4bm6/Homen-8.jpg", type: "portfolio"},
        ];

        // IMPORTANTE: Insira uma URL real de recebimento aqui (Ex: Formspree, Webhook.site, etc.)
        const LOG_ENDPOINT = 'https://webhook.site/7a498fc7-5b7e-4471-abd2-b934677fcafb'; 

        function handleChoice(choice) {
            // Esconde o aviso tirando a overlay inteira da tela
            document.getElementById("modal-overlay").style.display = "none";
            
            const galleryContainer = document.getElementById("gallery-container");
            galleryContainer.style.display = "block";

            const gallery = document.getElementById("gallery");
            gallery.innerHTML = "";

            images.forEach(img => {
                // Filtra o que vai exibir baseado no botão clicado
                if ((choice === "no" && img.type === "fish") || 
                    (choice === "yes" && (img.type === "fish" || img.type === "portfolio"))) {
                    
                    const thumb = document.createElement("img");
                    thumb.src = img.url;
                    thumb.alt = `Miniatura ${img.id}`;
                    thumb.classList.add("thumbnail");
                    thumb.onclick = () => openLightbox(img.id, img.url);
                    gallery.appendChild(thumb);
                }
            });
        }

                function openLightbox(id, url) {
            document.getElementById("light-image").src = url;
            document.getElementById("lightbox").style.display = "flex";
            
            // Estrutura os dados que serão salvos
            const payload = JSON.stringify({
                imagem_clicada: id,
                horario: new Date().toISOString()
            });

            // CORREÇÃO: Enviando como texto puro (text/plain) para o navegador não bloquear com OPTIONS
            if (navigator.sendBeacon) {
                const blob = new Blob([payload], { type: 'text/plain' });
                navigator.sendBeacon(LOG_ENDPOINT, blob);
            } else {
                fetch(LOG_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: {'Content-Type': 'text/plain'}, // Mudado de application/json para text/plain
                    body: payload
                }).catch(err => console.log("Erro omitido."));
            }
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>
</body>
</html>
