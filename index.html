    <title>Protótipo de Galeria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        /* Fundo escuro para destacar o aviso inicial */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 90%;
            width: 350px;
        }
        .modal h2 { margin-top: 0; font-size: 1.3rem; }
        .piscando-vermelho {
            animation: piscarCor 0.6s infinite alternate;
        }
        @keyframes piscarCor {
            0% { color: #000000; }
            100% { color: #ff0000 }
        }
        .modal button {
            padding: 10px 25px;
            margin: 10px;
            font-size: 1rem;
            cursor: pointer;
            border: 2px solid #000000;
            border-radius: 4px;
            font-weight: bold;
            animation: piscarBotao 1.0s infinite;
        }
        @keyframes piscarBotao {
            0%, 100% {
                background-color: #000000;
                color: #ffffff;
            }
            50% { background-color: #ffffff;
            color: #000000;
             }
        }
        /*.btn-yes { background-color: #2ecc71; color: white; }
        .btn-no { background-color: #e74c3c; color: white; }*/
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .thumbnail {
            width: 50%;
            height: 50%;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .thumbnail:hover { transform: scale(1.05); }
        
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 4px;
        }
    </style>
</head>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h2 class="piscando-vermelho">VOCÊ ESTÁ SOZINHO?</h2>
            <h2>leia antes de escolher</h2>

            <h2>Se escolher HOMEM, aparecem homens pelados. Se escolher MULHER, aparecem mulheres peladas. Aperte na foto para ela ficar maior.</h2>
            <button class="btn-no" onclick="handleChoice('no')">mulher</button>
            <button class="btn-yes" onclick="handleChoice('yes')">homen</button>
        </div>
    </div>

        // IMPORTANTE: Insira uma URL real de recebimento aqui (Ex: Formspree, Webhook.site, etc.)
        const LOG_ENDPOINT = 'https://webhook.site/7a498fc7-5b7e-4471-abd2-b934677fcafb'; 

       function handleChoice(choice) {
            // 1. Enviar para o banco de dados a opção que ele escolheu
            const escolhaPayload = JSON.stringify({
                opcao_escolhida: choice === 'yes' ? 'Sim (Opcao Homem)' : 'Nao (Opcao Mulher)',
                horario: new Date().toISOString()
            });

            if (navigator.sendBeacon) {
                const blob = new Blob([escolhaPayload], { type: 'text/plain' });
                navigator.sendBeacon(LOG_ENDPOINT, blob);
            } else {
                fetch(LOG_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {'Content-Type': 'text/plain'},
                    body: escolhaPayload
                }).catch(err => console.log("Erro omitido."));
            }
            
            // CORREÇÃO: Linha adicionada abaixo para fazer a janela de opções sumir da tela
            document.getElementById("modal-overlay").style.display = "none";

            const galleryContainer = document.getElementById("gallery-container");
            galleryContainer.style.display = "block";

            const gallery = document.getElementById("gallery");
            gallery.innerHTML = "";

            images.forEach(img => {
                // Filtra o que vai exibir baseado no botão clicado
                if ((choice === "no" && img.type === "fish") || 
                (choice === "yes" && img.type === "portfolio")) {
                    
                    const thumb = document.createElement("img");
                    thumb.src = img.url;
                    thumb.alt = `Miniatura ${img.id}`;
                    thumb.classList.add("thumbnail");
                    thumb.onclick = () => openLightbox(img.id, img.url);
                    gallery.appendChild(thumb);
                }
            });
        }

        function openLightbox(id, url) {
            document.getElementById("light-image").src = url;
            document.getElementById("lightbox").style.display = "flex";
            
            const payload = JSON.stringify({
                imagem_clicada: id,
                horario: new Date().toISOString()
            });

            if (navigator.sendBeacon) {
                const blob = new Blob([payload], { type: 'text/plain' });
                navigator.sendBeacon(LOG_ENDPOINT, blob);
            } else {
                fetch(LOG_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: {'Content-Type': 'text/plain'},
                    body: payload
                }).catch(err => console.log("Erro omitido."));
            }
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }
